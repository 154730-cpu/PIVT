
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe</title>

  <link id="favicon" rel="icon" href="favicons/logoI.png">

  <style>
    :root {
        color-scheme: light dark;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333333;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
        text-align: center;
    }

    .settings {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 800px;
        margin: 0 auto 25px;
    }

    input[type="text"] {
        background-color: #ffffff;
        color: black;
        border: none;
        border-radius: 5px;
        padding: 15px;
        font-size: 16px;
        width: 60%;
        min-width: 280px;
        box-sizing: border-box;
    }

    .favicon-buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 15px 0;
    }

    .favicon-button {
        width: 55px;
        height: 55px;
        padding: 7px;
        background-color: #ffffff;
        border: 2px solid #cccccc;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .favicon-button.selected {
        border: 3px solid #64bd3a;
    }

    .favicon-button img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    iframe {
        display: block;
        width: 100%;
        max-width: 1000px;
        height: 600px;
        border: 2px solid #cccccc;
        border-radius: 5px;
        margin: 20px auto;
    }

    iframe {
    outline: none !important;
    box-shadow: none !important;
    border: none !important;
    }

    @media (prefers-color-scheme: dark) {
        body {
            background-color: #121212;
            color: #e0e0e0;
        }

        .favicon-button,
        input[type="text"] {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        .favicon-button {
            border-color: #555555;
        }

        iframe {
            border-color: #555555;
        }
    }

    @media (max-width: 700px) {
        body {
            padding: 12px;
        }

        input[type="text"] {
            width: 100%;
            min-width: 0;
        }

        iframe {
            width: 100%;
            height: 500px;
        }
    }
  </style>
</head>

<body>

  <div class="settings">
    <input
      type="text"
      id="nameInput"
      placeholder="Name"
    >

    <input
      type="text"
      id="iframeInput"
      placeholder="Enter IFrame URL"
    >

    
    <div class="favicon-buttons">
    <button class="favicon-button" data-favicon="magister" aria-label="Magister">
        <img src="favicons/Magister.png" alt="Magister">
    </button>

    <button class="favicon-button" data-favicon="outlook" aria-label="Outlook">
        <img src="favicons/outlook.png" alt="Outlook">
    </button>

    <button class="favicon-button" data-favicon="tinkercad" aria-label="Tinkercad">
        <img src="favicons/tinkercad.png" alt="Tinkercad">
    </button>

    <button class="favicon-button" data-favicon="word" aria-label="Word">
        <img src="favicons/Word.png" alt="Word">
    </button>

    <button class="favicon-button" data-favicon="original" aria-label="Original">
        <img src="favicons/logoI.png" alt="Original">
    </button>
    </div>
  </div>

  <iframe
    id="iframe"
    src=""
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

  <script>
    const faviconChoices = {
        magister: "favicons/Magister.png",
        outlook: "favicons/outlook.png",
        tinkercad: "favicons/tinkercad.png",
        word: "favicons/Word.png",
        original: "favicons/logoI.png"
    };

    const faviconElement = document.getElementById("favicon");
    const nameInput = document.getElementById("nameInput");
    const iframeInput = document.getElementById("iframeInput");
    const iframe = document.getElementById("iframe");

    let iframeRequestId = 0;

    function updateFavicon(choice) {
      const path = faviconChoices[choice];

      if (!path) return;

      faviconElement.href = path;
      localStorage.setItem("Image", choice);

      document.querySelectorAll(".favicon-button").forEach(button => {
        button.classList.toggle(
          "selected",
          button.dataset.favicon === choice
        );
      });
    }

    function updateTitle() {
      const name = nameInput.value.trim();
      document.title = name || "Iframe";
      localStorage.setItem("Name", name);
    }

    function parseYouTubeTime(value) {
      if (!value) return 0;

      if (/^\d+$/.test(value)) {
        return Number(value);
      }

      const match = value.match(
        /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i
      );

      if (!match) return 0;

      return (
        Number(match[1] || 0) * 3600 +
        Number(match[2] || 0) * 60 +
        Number(match[3] || 0)
      );
    }

    function isGoogleGoto(input) {
      try {
        const parsed = new URL(input);
        const host = parsed.hostname.toLowerCase();

        return (
          (host === "google.com" ||
           host.endsWith(".google.com")) &&
          parsed.pathname === "/goto"
        );
      } catch {
        return false;
      }
    }

    // Resolve Google Goto using a free external redirect API.
    async function resolveGoogleGoto(input) {
      if (!isGoogleGoto(input)) {
        return input;
      }

      const apiURL =
        "https://api.domainee.dev/v1/tools/redirect-checker?url=" +
        encodeURIComponent(input);

      const response = await fetch(apiURL);

      if (!response.ok) {
        throw new Error(
          "Redirect API returned HTTP " + response.status
        );
      }

      const result = await response.json();

      if (!result.ok || !result.data?.finalUrl) {
        throw new Error(
          result.error?.message || "Could not resolve Google Goto"
        );
      }

      const destination = result.data.finalUrl;

      let destinationURL;

      try {
        destinationURL = new URL(destination);
      } catch {
        throw new Error("Invalid redirect destination");
      }

      const host = destinationURL.hostname
        .toLowerCase()
        .replace(/^www\./, "");

      if (
        host !== "youtube.com" &&
        host !== "m.youtube.com" &&
        host !== "youtu.be" &&
        host !== "youtube-nocookie.com"
      ) {
        throw new Error(
          "Google Goto did not resolve to YouTube"
        );
      }

      return destination;
    }

    // Extract a YouTube video ID and create its embed URL.
    function convertYouTubeURL(input) {
      try {
        const parsed = new URL(input);

        const host = parsed.hostname
          .toLowerCase()
          .replace(/^www\./, "");

        const parts = parsed.pathname
          .split("/")
          .filter(Boolean);

        let videoId = "";

        const startTime =
          parsed.searchParams.get("start") ||
          parsed.searchParams.get("t") ||
          "";

        if (host === "youtu.be") {
          videoId = parts[0] || "";
        }

        else if (
          host === "youtube.com" ||
          host === "m.youtube.com" ||
          host === "youtube-nocookie.com"
        ) {
          if (parts[0] === "watch") {
            videoId = parsed.searchParams.get("v") || "";
          }

          else if (
            ["embed", "shorts", "v"].includes(parts[0])
          ) {
            videoId = parts[1] || "";
          }

          else if (parsed.pathname.startsWith("/v=")) {
            videoId = parsed.pathname.substring(3);
          }
        }

        if (!videoId) {
          return input;
        }

        videoId = videoId.split("/")[0].split("&")[0];

        const seconds = parseYouTubeTime(startTime);

        let embedURL =
          "https://www.youtube.com/embed/" +
          encodeURIComponent(videoId);

        if (seconds > 0) {
          embedURL += "?start=" + seconds;
        }

        return embedURL;

      } catch {
        return input;
      }
    }

    async function updateIframe() {
      const requestId = ++iframeRequestId;
      const url = iframeInput.value.trim();

      if (!url) {
        iframe.src = "";
        localStorage.setItem("IframeURL", "");
        return;
      }

      localStorage.setItem("IframeURL", url);
      iframe.src = "";

      try {
        // Step 1: Resolve Google Goto if necessary.
        const resolvedURL = await resolveGoogleGoto(url);

        // Ignore old requests if the input changed meanwhile.
        if (requestId !== iframeRequestId) return;

        // Step 2: Convert the resolved YouTube URL.
        const convertedURL = convertYouTubeURL(resolvedURL);

        if (convertedURL === resolvedURL && isGoogleGoto(url)) {
          throw new Error("Could not extract YouTube video ID");
        }

        // Step 3: Display the video.
        iframe.src = convertedURL;

      } catch (error) {
        console.error("Could not load iframe:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      nameInput.value = localStorage.getItem("Name") || "";
      iframeInput.value = localStorage.getItem("IframeURL") || "";

      const savedFavicon =
        localStorage.getItem("Image") || "original";

      updateFavicon(savedFavicon);
      updateTitle();
      updateIframe();

      document.querySelectorAll(".favicon-button").forEach(button => {
        button.addEventListener("click", () => {
          updateFavicon(button.dataset.favicon);
        });
      });

      nameInput.addEventListener("input", updateTitle);
      iframeInput.addEventListener("change", updateIframe);
    });
  </script>

</body>
</html>
